name: Build & Push Docker Image

# Builds the multi-arch image and pushes it to GHCR, and to Docker Hub once the
# DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret are both set. Nothing
# is pushed before both arches have booted and served a request. A push to main
# gets :edge and :sha-<short>. A vX.Y.Z tag gets :X.Y.Z, :X.Y, :X and
# :sha-<short>, plus :latest when it is the newest tag.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write # Trivy uploads its CVE report (SARIF) to the Security tab

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/shiplog
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A step `if` cannot read `secrets`, so the variable stands in for the pair.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest moves only for the newest tag, so re-cutting an older version
      # cannot drag it backwards. checkout fetches no tags, and sort -V puts
      # v8.10.0 after v8.9.0, but also v8.10.0-rc1 after v8.10.0, so only tags
      # this workflow builds count.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/shiplog,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # latest is the newest release, so an unreleased merge never reaches
          # people who pull it. The tip of main goes to edge. The action adds
          # latest on its own for any semver tag unless the flavor turns that off.
          #
          # {{major}} and {{major}}.{{minor}} follow whichever tag built last, so
          # re-cutting an old version moves them back. After that, re-run the
          # newest tag's build.
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: shiplog:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: shiplog:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The logs go into a variable because `docker logs | grep -q` dies of
      # SIGPIPE under pipefail once the log grows.
      - name: "Smoke test: both arches must boot and serve /"
        run: |
          set -euo pipefail
          smoke() {
            local tag="$1" platform="$2" budget="$3"
            local name="sl-smoke-${platform##*/}"
            echo "::group::smoke ${platform}"
            docker run -d --name "$name" --platform "$platform" -p 8484:8484 \
              -v /var/run/docker.sock:/var/run/docker.sock:ro "$tag"
            for i in $(seq 1 "$budget"); do
              logs=$(docker logs "$name" 2>&1 || true)
              if [[ "$logs" == *"SHIPLOG IS READY"* ]] && curl -fsS -o /dev/null http://localhost:8484/; then
                echo "✅ ${platform} ready + serving / after ${i}s"
                docker rm -f "$name" >/dev/null
                echo "::endgroup::"
                return 0
              fi
              sleep 1
            done
            echo "❌ ${platform} not ready within ${budget}s, logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            echo "::endgroup::"
            return 1
          }
          smoke shiplog:smoke-amd64 linux/amd64 30
          smoke shiplog:smoke-arm64 linux/arm64 90

      # Most findings live in the distroless base and cannot be fixed here, so the
      # scan reports without failing the build.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shiplog:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are safe here because this is a plain multi-arch push,
          # not a push by digest with a manifest merge.
          provenance: true
          sbom: true

      # An access token with read, write and delete scope can edit the
      # description; the account password is refused once 2FA is on.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "Changelog bubbles in the Unraid Docker tab: see what changed before you update a container."
          enable-url-completion: true
