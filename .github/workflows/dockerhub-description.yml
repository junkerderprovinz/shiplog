# Pushes the README to the Docker Hub overview on demand. build.yml does the
# same after a full build; a run that builds nothing tells whether the
# credential itself is broken.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v5

      # Unlike build.yml there is no gate, so a missing secret turns the run red.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/shiplog
          short-description: "Changelog bubbles in the Unraid Docker tab: see what changed before you update a container."
          enable-url-completion: true
