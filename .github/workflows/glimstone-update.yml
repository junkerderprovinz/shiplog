name: GlimStone update

on:
  repository_dispatch:
    types: [glimstone-release]
  # Catches a release whose dispatch never arrived.
  schedule:
    - cron: "44 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
      issues: write
      actions: write
    uses: junkerderprovinz/junkerderprovinz/.github/workflows/glimstone-update.yml@9b47b5906ffba390d9d09650ddabb5ce5a975551 # main
    with:
      ci-workflow: lint.yml
    secrets: inherit
