name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Vet + race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          check-latest: true
      # The action's prebuilt binary lags behind the Go version go.mod targets.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  # The plugin package is what people install, so it is built and its engine
  # has to start on the socket and serve the status page.
  plugin:
    name: Plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.4"
          check-latest: true
      - name: Build the package
        run: bash plugin/pkg_build.sh 0.0.0-ci
      - name: "Smoke test: the engine starts on its socket and serves /"
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          tar -C "$root" -xf plugin/out/shiplog-0.0.0-ci-x86_64-1.txz
          sock="$root/shiplog.sock"
          mkdir -p "$root/data"
          SOCKET="$sock" DATA_DIR="$root/data" "$root/usr/local/emhttp/plugins/shiplog/bin/shiplog" > "$root/log" 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "SHIPLOG IS READY" "$root/log" && curl -fsS -o /dev/null --unix-socket "$sock" http://shiplog/; then
              echo "ready and serving / after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat "$root/log"
          exit 1
